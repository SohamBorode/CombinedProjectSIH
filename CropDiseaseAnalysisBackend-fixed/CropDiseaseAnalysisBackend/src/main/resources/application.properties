server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

spring.application.name=cropshield-backend
# spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/cropshield;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.url=jdbc:postgresql://localhost:5432/cropshield
spring.datasource.username=postgres
spring.datasource.password=1947
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
app.storage.directory=${UPLOAD_DIRECTORY:./uploads}
# app.ml.enabled=${ML_ENABLED:false}
app.ml.enabled=true
app.ml.base-url=${ML_BASE_URL:http://localhost:8000}
app.ml.predict-path=${ML_PREDICT_PATH:/predict}
app.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:5000}
app.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:30000}

logging.level.root=INFO
logging.level.com.example=DEBUG
logging.file.name=app.log

